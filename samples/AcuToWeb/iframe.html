<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Load a URL in an iFrame</h1>
  <form id="urlForm">
    <label for="urlInput">Enter URL:</label>
    <input type="text" id="urlInput" placeholder="https://example.com" size="50" required>
    <button type="submit">Load</button>
  </form>

  <iframe id="urlFrame" src=""></iframe>

  <script>
    document.getElementById('urlForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const url = document.getElementById('urlInput').value;
      document.getElementById('urlFrame').src = url;
    });
  </script>
</body>
</html>
